<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#cfe8f8">
<title>孟婆島｜孟婆茶會</title>
<meta name="description" content="孟婆茶會：用「上帝視角」看見自己卡住的人生問題。適合誰、現場做什麼、怎麼進行、場次與報名，這裡都有白話說明，也有互動地圖。">
<link rel="canonical" href="https://khlin712.github.io/mengpo-party/">
<meta property="og:type" content="website">
<meta property="og:title" content="孟婆島｜孟婆茶會">
<meta property="og:description" content="從崎嶇島出發，走過疑問橋、奈何橋，走向繽紛世界。看見卡點，走出迴圈。">
<meta property="og:url" content="https://khlin712.github.io/mengpo-party/">
<link rel="stylesheet" href="./ui.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js","three/addons/renderers/CSS2DRenderer.js":"./vendor/CSS2DRenderer.js"}}</script>
</head>
<body>
<main id="app">
  <div id="stage" role="img" aria-label="五座六角形的島與兩座橋組成的互動地圖；完整文字內容請按「首頁」，或用清單閱讀"></div>

  <header class="brand">
    <a class="logo" href="./" aria-label="孟婆島首頁"><span class="mark">婆</span><span class="words"><b>孟婆茶會</b><small>看見卡點，走出迴圈</small></span></a>
  </header>


  <nav class="toolbar" aria-label="主要操作">
    <button id="open-home" type="button" title="首頁與文字版介紹">首頁</button>
    <button id="sidebar-toggle" type="button" aria-expanded="true" aria-controls="sidebar">☰ 清單</button>
    <button id="explore-toggle" type="button" aria-pressed="false" title="顯示地圖的進階選項">探索</button>
    <button id="signup-open" class="cta" type="button">報名／場次</button>
  </nav>

  <aside id="sidebar" class="sidebar" aria-label="站點清單與我的提綱">
    <button id="sheet-handle" class="sheet-handle" type="button" aria-label="展開或收合清單"><i></i></button>
    <div class="side-head">
      <div class="eyebrow">THE ISLAND INDEX</div>
      <h2>從你在意的問題開始</h2>
      <div class="route-chips" id="route-chips" role="group" aria-label="依你最在意的問題推薦順序"></div>
      <input id="search" class="search" type="search" aria-label="搜尋島嶼或關鍵字" placeholder="搜尋：催眠、法事、價格、親子…">
      <div class="side-tabs" role="tablist">
        <button role="tab" id="tab-islands" class="active" aria-selected="true">島嶼</button>
        <button role="tab" id="tab-outline" aria-selected="false">我的提綱 <span id="outline-count"></span></button>
      </div>
    </div>
    <div id="side-body" class="side-body"></div>
  </aside>

  <article id="card" class="card" hidden aria-label="詳細資料">
    <button id="card-handle" class="sheet-handle" type="button" aria-label="切換卡片高度"><i></i></button>
    <button class="close" id="card-close" type="button" aria-label="關閉詳細資料">×</button>
    <div id="card-content"></div>
  </article>

  <div class="hud" id="hud">
    <div class="seg" role="group" aria-label="地圖選項">
      <button id="home" type="button" title="回到全景">⤢ 全景</button>
      <button id="tour-start" type="button" title="自動導覽">▶ 導覽</button>
      <button class="tg" data-toggle="names" aria-pressed="true" type="button">名牌</button>
      <button class="tg" data-toggle="people" aria-pressed="true" type="button">人物</button>
      <button class="tg" data-toggle="pins" aria-pressed="true" type="button">重點</button>
      <button class="tg" data-toggle="bird" aria-pressed="false" type="button">鳥瞰</button>
      <button class="tg" data-toggle="freeze" aria-pressed="false" type="button">暫停</button>
    </div>
  </div>

  <section class="controls" id="controls" aria-label="時間、旅程與主題">
    <div class="control-tabs" role="tablist">
      <button role="tab" class="active" aria-selected="true" data-panel="day">01 島上的一天</button>
      <button role="tab" aria-selected="false" data-panel="journey">02 走一圈</button>
      <button role="tab" aria-selected="false" data-panel="groups">03 主題分類</button>
    </div>
    <div class="panel active" id="panel-day" role="tabpanel">
      <div class="day-row">
        <button id="day-play" class="play" type="button" aria-label="播放一天">▶</button>
        <output id="clock">15:00</output>
        <input id="day" type="range" min="0" max="1439" value="900" aria-label="島上時間（分鐘）">
        <div class="presets" role="group" aria-label="時段">
          <button type="button" data-time="360">清晨</button><button type="button" data-time="720">白天</button><button type="button" data-time="1080">黃昏</button><button type="button" data-time="1260">夜晚</button>
        </div>
      </div>
      <p class="control-note" id="day-note"></p>
    </div>
    <div class="panel" id="panel-journey" role="tabpanel">
      <div class="stops" id="stops"></div>
      <p class="control-note">依序走一圈：從崎嶇島出發，過疑問橋、茶會、奈何橋，最後到報名。</p>
    </div>
    <div class="panel" id="panel-groups" role="tabpanel">
      <div class="group-buttons" id="group-buttons"></div>
      <p class="control-note">可複選。符合的站保持原色，其他的淡下去。</p>
    </div>
  </section>

  <div id="tour-caption" class="tour-caption" aria-live="polite"></div>
  <div class="tour-controls"><span id="tour-time">00 / 72</span><button id="tour-pause" type="button">暫停</button><button id="tour-replay" type="button">重播</button><button id="tour-exit" type="button">離開</button></div>

  <div class="intro" id="signup" hidden>
    <div class="intro-box" role="dialog" aria-modal="true" aria-labelledby="signup-title">
      <button class="close" id="signup-close" type="button" aria-label="關閉">×</button>
      <div class="eyebrow">SIGN UP</div><h2 id="signup-title">場次與報名</h2>
      <div id="signup-body"></div>
    </div>
  </div>

  <section id="home-page" class="page" aria-label="孟婆茶會介紹" hidden></section>

  <div id="gl-notice" class="gl-notice" hidden role="alert"><p id="gl-text"></p><button id="gl-reload" type="button">重新整理頁面</button></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="loading" class="loading" role="status"><h2>孟婆島</h2><p>正在泡茶、整理島嶼…</p></div>
</main>
<noscript><p style="padding:24px">孟婆島需要 JavaScript 才能顯示互動地圖。你也可以直接私訊 LINE 官方帳號詢問孟婆茶會。</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
